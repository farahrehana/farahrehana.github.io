<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Portfolio Nurul Farah Rehana, Cloud & DevOps Trainee.">
  <title>Nurul Farah Rehana | Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 10%, #302254, transparent 50%),
        #0b1020;
      color: #f1f5f9;
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.7;
    }

    main {
      width: 100%;
      max-width: 760px;
      padding: clamp(28px, 6vw, 64px);
      background: #131b2e;
      border: 1px solid #33405b;
      border-radius: 24px;
      box-shadow: 0 24px 70px #00000040;
    }

    .label {
      margin: 0 0 24px;
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 60px);
      line-height: 1.12;
      letter-spacing: -1.5px;
      overflow-wrap: break-word;
    }

    .role {
      margin: 20px 0 0;
      color: #c4b5fd;
      font-size: 19px;
      font-weight: 600;
    }

    .fact {
      margin: 24px 0 0;
      max-width: 560px;
      color: #b9c6dc;
    }

    .section {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid #33405b;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill {
      padding: 8px 18px;
      background: #24213f;
      border: 1px solid #63558e;
      border-radius: 999px;
      color: #e0d7ff;
      font-size: 14px;
      font-weight: 600;
    }

    a {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 22px;
      background: #c4b5fd;
      border-radius: 10px;
      color: #17112b;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      background: #ddd6fe;
    }

    a:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 5px;
    }
  </style>
</head>

<body>
  <main>
    <p class="label">Portfolio peribadi</p>

    <h1>Nurul Farah Rehana</h1>
    <p class="role">Cloud &amp; DevOps Trainee</p>

    <p class="fact">
      Pelajar tahun akhir BBA dalam major Artificial Intelligence
      yang sedang membina kemahiran dalam bidang Cloud dan DevOps.
    </p>

    <section class="section" aria-labelledby="kemahiran">
      <h2 id="kemahiran">Kemahiran</h2>
      <div class="skills">
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Docker</span>
        <span class="skill">AWS</span>
      </div>
    </section>

    <a href="https://github.com/farahrehana">Lihat GitHub saya ↗</a>
  </main>
</body>
</html>
